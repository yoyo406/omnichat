<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OmniChat — IA multi-modèles</title>
<meta name="description" content="Chat IA multi-fournisseur. OpenAI, Anthropic, Google Gemini, DeepSeek, et plus. Vos clés, votre navigateur.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" role="application" aria-label="OmniChat - Chat IA multi-modèles">

  <!-- Sidebar overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Conversations">
    <div class="sidebar-header">
      <h1>OmniChat</h1>
      <button class="sidebar-close" id="sidebarClose" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sidebar-header" style="border-bottom:none;padding-top:4px">
      <button class="new-chat-btn" id="newChatBtn" aria-label="Nouvelle conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Nouveau chat
      </button>
    </div>
    <div class="search-conversations">
      <input type="search" id="searchConv" placeholder="Rechercher..." aria-label="Rechercher une conversation" autocomplete="off">
    </div>
    <div class="conversation-list" id="conversationList" role="listbox" aria-label="Liste des conversations">
      <!-- Rendered by JS -->
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-secondary" id="settingsBtn" aria-label="Paramètres" style="flex:1;justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Paramètres
      </button>
      <button class="sidebar-toggle" id="sidebarToggleSide" aria-label="Masquer le menu" style="flex-shrink:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="18" x2="15" y2="12"/><line x1="15" y1="12" x2="9" y2="6"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" role="main">
    <!-- Header -->
    <header class="header" role="banner">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu des conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="model-selector">
        <label for="providerSelect" class="sr-only">Fournisseur</label>
        <select id="providerSelect" aria-label="Fournisseur de modèle"></select>
        <label for="modelSelect" class="sr-only">Modèle</label>
        <select id="modelSelect" aria-label="Modèle"></select>
        <span class="model-name" id="modelDisplayName" aria-live="polite"></span>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="themeToggle" aria-label="Basculer le thème">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="header-btn" id="headerSettingsBtn" aria-label="Paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <div class="messages" id="messagesContainer" role="log" aria-label="Messages de la conversation" aria-live="polite">
      <div class="messages-inner" id="messagesInner">
        <!-- Rendered by JS (empty state or messages) -->
      </div>
      <button class="scroll-bottom" id="scrollBottomBtn" aria-label="Aller en bas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      </button>
    </div>

    <!-- ARIA live region for streaming -->
    <div class="live-region" id="liveRegion" aria-live="polite" aria-atomic="true"></div>

    <!-- Composer -->
    <div class="composer" role="form" aria-label="Zone de saisie">
      <div class="composer-inner">
        <div class="composer-textarea-wrap">
          <textarea id="composerTextarea" rows="1" placeholder="Écris un message…" aria-label="Message" autocomplete="off"></textarea>
        </div>
        <div class="composer-actions">
          <button class="composer-btn stop" id="stopBtn" aria-label="Arrêter la génération" title="Arrêter">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="composer-btn send" id="sendBtn" aria-label="Envoyer le message" title="Envoyer (Ctrl+Entrée)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="settingsTitle">Paramètres</h2>
        <button class="modal-close" id="settingsClose" aria-label="Fermer les paramètres">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="settingsBody">
        <!-- Rendered by JS -->
      </div>
      <div class="modal-footer">
        <div class="modal-footer-actions">
          <button class="btn btn-danger" id="clearAllBtn">Tout effacer</button>
        </div>
        <button class="btn btn-primary" id="settingsSaveBtn">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>

<!-- App -->
<script src="app.js" defer></script>
</body>
</html>
