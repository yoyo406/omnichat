<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chat IA multi-fournisseur : vos clés API restent dans votre navigateur.">
  <title>OmniChat — IA multi-modèles</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#messagesContainer">Aller aux messages</a>

  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <h1>OmniChat</h1>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Fermer le menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="sidebar-new-chat">
        <button class="new-chat-btn" id="newChatBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Nouveau chat
        </button>
      </div>

      <div class="search-conversations">
        <label class="sr-only" for="searchConv">Rechercher une conversation</label>
        <input id="searchConv" type="search" placeholder="Rechercher…" autocomplete="off">
      </div>

      <ul class="conversation-list" id="conversationList" aria-label="Liste des conversations"></ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary" id="settingsBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Paramètres
        </button>
        <button class="sidebar-toggle sidebar-collapse" id="sidebarToggleSide" type="button" aria-label="Masquer le menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="model-selector">
          <label class="sr-only" for="providerSelect">Fournisseur</label>
          <select id="providerSelect" aria-label="Fournisseur de modèle"></select>
          <label class="sr-only" for="modelSelect">Modèle</label>
          <select id="modelSelect" aria-label="Modèle"></select>
          <span class="model-name" id="modelDisplayName" aria-live="polite"></span>
        </div>

        <div class="header-actions">
          <button class="header-btn" id="themeToggle" type="button" aria-label="Basculer le thème" aria-pressed="false">
            <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          </button>
          <button class="header-btn" id="headerSettingsBtn" type="button" aria-label="Ouvrir les paramètres">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messagesContainer" aria-label="Messages de la conversation" tabindex="-1">
        <div class="messages-inner" id="messagesInner" role="list"></div>
        <button class="scroll-bottom" id="scrollBottomBtn" type="button" aria-label="Aller au dernier message" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m6-7-6 7-6-7"/></svg>
        </button>
      </section>

      <div class="live-region" id="liveRegion" aria-live="polite" aria-atomic="true"></div>

      <form class="composer" id="composerForm" aria-label="Écrire un message">
        <div class="composer-inner">
          <div class="composer-textarea-wrap">
            <label class="sr-only" for="composerTextarea">Message</label>
            <textarea id="composerTextarea" rows="1" placeholder="Écris un message…" autocomplete="off"></textarea>
          </div>
          <div class="composer-actions">
            <button class="composer-btn stop" id="stopBtn" type="button" aria-label="Arrêter la génération" title="Arrêter" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button class="composer-btn send" id="sendBtn" type="submit" aria-label="Envoyer le message" title="Envoyer (Ctrl ou Cmd + Entrée)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM11 13l4-4"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-hint">Ctrl ou Cmd + Entrée pour envoyer · Maj + Entrée pour un saut de ligne</p>
      </form>
    </main>
  </div>

  <div class="modal-overlay" id="settingsModal" hidden aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
      <header class="modal-header">
        <h2 id="settingsTitle">Paramètres</h2>
        <button class="modal-close" id="settingsClose" type="button" aria-label="Fermer les paramètres">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="modal-body" id="settingsBody"></div>
      <footer class="modal-footer">
        <button class="btn btn-danger" id="clearAllBtn" type="button">Tout effacer</button>
        <button class="btn btn-primary" id="settingsSaveBtn" type="button">Enregistrer</button>
      </footer>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
